services:
  relayd:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      RELAY_HTTP_ADDR: ":8080"
      RELAY_WORKERS: "16"
      RELAY_TENANT_RPS: "500"
    healthcheck:
      test: ["CMD", "/usr/local/bin/relayd", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
